uniswap_v3_positions:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: /usr/local/airflow/include/gcp/service_account.json
      project: "{{ env_var('GCP_PROJECT', 'your-gcp-project') }}"
      dataset: "{{ env_var('BQ_DATASET', 'uniswap_v3_positions') }}"
      threads: 1
      timeout_seconds: 500
      location: US
